<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hỏi Bài – Xem Tarot online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap&subset=vietnamese" rel="stylesheet">
<style>
:root{--bg:#080914;--panel:rgba(20,21,43,.92);--line:#3c3b5c;--ink:#f4eddf;--mut:#b4b3ca;--acc:#9263c7;--gold:#d6b56a;--cw:clamp(52px,9vw,96px)}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:var(--bg);isolation:isolate;color:var(--ink);font:18px/1.65 "EB Garamond",Georgia,serif;text-transform:uppercase;overflow-x:hidden}
h1,h2,h3{font-family:"EB Garamond",Georgia,serif;font-weight:600;line-height:1.2;text-transform:uppercase}
.stage{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:32px 18px 60px;animation:in .6s ease}
.stage[hidden]{display:none}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.audio-control{position:fixed;z-index:10;top:14px;right:14px}
.audio-toggle{padding:8px 14px;font:inherit;font-size:16px;color:var(--ink);background:rgba(20,21,43,.92);border:1px solid var(--line);border-radius:24px;cursor:pointer;backdrop-filter:blur(8px)}
.audio-toggle:hover,.audio-toggle:focus-visible{border-color:var(--gold);outline:none}
@media(max-width:480px){.audio-control{top:10px;right:10px}}

/* Hero */
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.brand{font-family:"EB Garamond",Georgia,serif;color:var(--gold);font-size:24px;margin-bottom:28px;text-transform:uppercase}
.hero h1{position:relative;z-index:2;font-size:clamp(34px,6.4vw,62px);max-width:14em;margin-bottom:14px}
.hero p.sub{color:var(--mut);max-width:34em;margin-bottom:26px}
.ask{display:flex;gap:10px;max-width:700px;flex-wrap:wrap}
.ask textarea{flex:1 1 320px;min-height:64px;padding:14px 16px;font:inherit;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:10px;resize:none}
.ask textarea:focus{outline:none;border-color:var(--gold)}
.btn{padding:14px 26px;font:inherit;font-weight:bold;color:#fff;background:var(--acc);border:0;border-radius:10px;cursor:pointer}
.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.err{color:#ff9d80;margin-top:10px;min-height:24px;font-size:15px}
.eg{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;max-width:700px}
.eg button{font:inherit;font-size:14px;color:var(--mut);background:transparent;border:1px solid var(--line);border-radius:20px;padding:5px 12px;cursor:pointer}
.eg button:hover{color:var(--ink);border-color:var(--gold)}
.hero > :not(.deco){position:relative;z-index:1}
.deco{position:absolute;z-index:0;right:18px;top:calc(50% - 250px);width:300px;height:280px;margin:0;pointer-events:none;opacity:.9}
.deco .card{position:absolute;left:50%;top:60px;margin-left:calc(var(--cw)/-2);transform-origin:50% 140%;animation:sway 6s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(var(--a))}to{transform:rotate(calc(var(--a) + 5deg))}}
@media(max-width:480px){
  .deco{right:0;top:calc(50% - 270px);width:220px;height:210px;--cw:72px;opacity:.65}
}

/* Card */
.card{width:var(--cw);height:calc(var(--cw)*1.7);border-radius:7px;cursor:pointer;
background:#173240 url("images/back.jpg") center / cover no-repeat;
border:2px solid var(--gold);box-shadow:0 4px 12px rgba(0,0,0,.45)}

/* Spread */
.head{margin-bottom:6px}
.head h2{font-size:clamp(24px,4vw,34px)}
.q-echo{color:var(--gold);font-family:"EB Garamond",Georgia,serif;font-style:italic;margin:6px 0 4px;text-transform:uppercase}
.hint{color:var(--mut);font-size:15px}
.fan{position:relative;height:calc(var(--cw)*1.7 + 80px);margin-top:26px}
.fan .card{position:absolute;left:50%;top:50px;margin-left:calc(var(--cw)/-2);transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .5s,box-shadow .3s}
.fan .card:hover{box-shadow:0 0 0 2px var(--gold),0 8px 18px rgba(0,0,0,.5)}
.fan .card.sel{box-shadow:0 0 0 3px var(--acc),0 0 22px var(--acc)}
.fan.done .card:not(.sel){opacity:0;pointer-events:none}
.count{margin-top:14px;font-family:"EB Garamond",Georgia,serif;font-size:22px;color:var(--gold)}

/* Reading */
.row3{display:flex;justify-content:center;gap:clamp(12px,4vw,40px);margin:24px 0 28px}
.slot{text-align:center;width:min(30vw,170px)}
.flip{perspective:900px;width:100%;aspect-ratio:1/1.7}
.flip .in{position:relative;width:100%;height:100%;transition:transform 1s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .bk,.flip .ft{position:absolute;inset:0;border-radius:9px;border:2px solid var(--gold);backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 6px 18px rgba(0,0,0,.5);overflow:hidden}
.flip .bk{transform:rotateY(0deg);background:#173240 url("images/back.jpg") center / cover no-repeat}
.flip .ft{transform:rotateY(180deg);background:#efe6d2;color:#2a2418;overflow:hidden}
.ft .art{display:block;width:100%;height:100%;object-fit:contain;background:#efe6d2}
.ft .image-error{position:absolute;inset:0;align-items:center;justify-content:center;padding:16px;text-align:center;font-size:13px}
.ft .image-error:not([hidden]){display:flex}
.ft.rev .art{transform:rotate(180deg)}
.card-credit{text-align:center;color:var(--mut);font-size:12px;margin:-12px 0 24px}
.card-credit a{color:inherit;text-underline-offset:3px}
.cap{margin-top:10px;font-size:14px;color:var(--mut);opacity:0;transition:opacity .6s}
.cap b{display:block;color:var(--ink);font-family:"EB Garamond",Georgia,serif;font-size:18px;font-weight:600;text-transform:uppercase}
.slot.shown .cap{opacity:1}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px clamp(16px,4vw,30px);max-width:720px;margin:0 auto}
.panel h3{font-size:clamp(20px,3.4vw,26px);margin-bottom:14px}
.prog{color:var(--mut);font-size:14px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chips button{font:inherit;font-size:15px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:20px;padding:6px 14px;cursor:pointer}
.chips button:hover{border-color:var(--gold)}
.panel textarea{width:100%;min-height:78px;padding:12px;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;resize:vertical;margin-bottom:14px}
.panel textarea:focus{outline:none;border-color:var(--gold)}
.load{display:flex;align-items:center;gap:12px;color:var(--mut)}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.res h3{color:var(--gold);margin:18px 0 6px;font-size:20px}
.res h3:first-child{margin-top:0}
.res p{margin-bottom:10px}.res ul{margin:0 0 10px 20px}
.res li{margin-bottom:4px}
.foot{color:var(--mut);font-size:13px;margin-top:16px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}

/* Vũ trụ: các lớp trang trí không chặn thao tác trên nội dung. */
.cosmos{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
background:radial-gradient(ellipse at 80% 20%,#1c1838 0,transparent 55%),linear-gradient(160deg,#080914,#0c1226 65%,#080914)}
.cosmos::before{content:"";position:absolute;inset:-12%;opacity:.7;
background:radial-gradient(ellipse at 76% 24%,rgba(126,65,173,.36),transparent 38%),radial-gradient(ellipse at 25% 80%,rgba(34,108,143,.25),transparent 42%),radial-gradient(ellipse at 95% 90%,rgba(104,53,133,.22),transparent 35%);
animation:nebula-drift 28s ease-in-out infinite alternate}
.cosmos::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 35% 48%,rgba(8,9,20,.52),transparent 75%)}
.star{position:absolute;left:var(--x);top:var(--y);width:var(--size);height:var(--size);border-radius:50%;background:#e1e8ff;opacity:var(--opacity);animation:twinkle var(--duration) ease-in-out var(--delay) infinite alternate}
.star.bright{background:#fff4d9;box-shadow:0 0 7px 1px #c7bbf580}
.meteor{position:absolute;top:var(--top);left:var(--left);height:1px;width:var(--length,140px);opacity:0;background:linear-gradient(90deg,transparent,#d7d5ff);transform:rotate(35deg);animation:meteor-flight var(--duration,9s) linear var(--delay) infinite}
.meteor::after{content:"";position:absolute;right:0;top:-1px;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 8px #d7d5ff}
@keyframes nebula-drift{to{transform:translate3d(-3%,3%,0) scale(1.08)}}
@keyframes twinkle{from{opacity:calc(var(--opacity)*.35)}to{opacity:var(--opacity)}}
@keyframes meteor-flight{0%{opacity:0;transform:translate3d(0,0,0) rotate(35deg)}3%{opacity:.85}20%,100%{opacity:0;transform:translate3d(460px,322px,0) rotate(35deg)}}
.brand{letter-spacing:.12em;text-shadow:0 0 24px #d6b56a45}
.hero h1{text-shadow:0 2px 24px #080914}
.panel{box-shadow:0 16px 60px #0004}
.btn{box-shadow:0 4px 22px #9263c726;transition:box-shadow .25s,filter .25s}
.btn:hover{box-shadow:0 4px 28px #9263c74d}
.eg button{background:#0d1023b3}
.cosmos.paused *, .cosmos.paused::before{animation-play-state:paused}
@media(max-width:600px){.star:nth-child(n+61){display:none}.meteor{width:90px}.cosmos::before{animation-duration:40s}}
@media(prefers-reduced-motion:reduce){.meteor{display:none}}

/* Ánh sáng tương tác và hiệu ứng chọn / lật bài. */
.cursor-aura{position:fixed;left:0;top:0;width:380px;height:380px;margin:-190px;z-index:0;pointer-events:none;opacity:0;background:radial-gradient(circle,#ad83ed19,transparent 68%);transition:opacity .6s;will-change:transform}
.cursor-aura.active{opacity:1}
.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;inset:-60% -100%;pointer-events:none;background:linear-gradient(110deg,transparent 43%,#ffffff26 50%,transparent 57%);transform:translateX(-45%)}
.btn:hover::after{animation:button-shine .8s ease-out}
@keyframes button-shine{to{transform:translateX(45%)}}
.ask textarea,.panel textarea{transition:border-color .3s,box-shadow .3s}
.ask textarea:focus,.panel textarea:focus{box-shadow:0 0 0 4px #d6b56a0d,0 0 30px #a77ee51c}
.fan .card::after{content:"";position:absolute;inset:4px;border:1px solid transparent;border-radius:4px;pointer-events:none;transition:border-color .3s}
.fan .card.sel::after{border-color:#ffe6ad;animation:selected-glow 1.8s ease-in-out infinite alternate}
@keyframes selected-glow{to{box-shadow:inset 0 0 18px #e6c88970,0 0 16px #c59aff70}}
.slot{position:relative}
.slot::before{content:"";position:absolute;inset:-20px -35px 20px;z-index:-1;pointer-events:none;background:radial-gradient(ellipse,#b990e545,transparent 68%);opacity:0}
.slot.shown::before{animation:reveal-aura 1.6s ease-out forwards}
@keyframes reveal-aura{0%{opacity:0;transform:scale(.7)}35%{opacity:1;transform:scale(1.1)}100%{opacity:.35;transform:scale(1)}}
.slot.shown .cap{animation:caption-rise .6s ease-out}
@keyframes caption-rise{from{transform:translateY(8px)}to{transform:translateY(0)}}
.fx-ripple{position:fixed;width:14px;height:14px;margin:-7px;border:1px solid #e4ccff;border-radius:50%;pointer-events:none;z-index:10;animation:ripple-out .7s ease-out forwards}
@keyframes ripple-out{to{transform:scale(6);opacity:0}}
.fx-spark{position:fixed;width:4px;height:4px;margin:-2px;background:#ffe3a2;border-radius:50%;box-shadow:0 0 8px #e3bdff;pointer-events:none;z-index:10;animation:spark-out .85s ease-out forwards}
@keyframes spark-out{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
@media(pointer:coarse){.cursor-aura{display:none}}
@media(prefers-reduced-motion:reduce){.cursor-aura,.fx-ripple,.fx-spark{display:none}.slot.shown::before{opacity:.3}}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="cursor-aura" id="cursorAura" aria-hidden="true"></div>
<div class="cosmos" id="cosmos" aria-hidden="true">
  <div id="starfield"></div>
  <span class="meteor" style="--top:4%;--left:8%;--duration:7s;--delay:-1s;--length:110px"></span>
  <span class="meteor" style="--top:12%;--left:34%;--duration:9s;--delay:-4s;--length:160px"></span>
  <span class="meteor" style="--top:2%;--left:62%;--duration:8s;--delay:-6s;--length:140px"></span>
  <span class="meteor" style="--top:26%;--left:-12%;--duration:10s;--delay:-3s;--length:180px"></span>
  <span class="meteor" style="--top:38%;--left:18%;--duration:8.5s;--delay:-7s;--length:120px"></span>
  <span class="meteor" style="--top:18%;--left:76%;--duration:11s;--delay:-9s;--length:150px"></span>
  <span class="meteor" style="--top:54%;--left:-8%;--duration:9.5s;--delay:-5s;--length:130px"></span>
  <span class="meteor" style="--top:44%;--left:46%;--duration:7.5s;--delay:-2s;--length:170px"></span>
  <span class="meteor" style="--top:64%;--left:12%;--duration:12s;--delay:-10s;--length:100px"></span>
  <span class="meteor" style="--top:6%;--left:88%;--duration:10.5s;--delay:-8s;--length:140px"></span>
  <span class="meteor" style="--top:30%;--left:58%;--duration:8s;--delay:-3.5s;--length:110px"></span>
  <span class="meteor" style="--top:72%;--left:38%;--duration:11.5s;--delay:-6.5s;--length:160px"></span>
</div>

<div class="audio-control">
  <button class="audio-toggle" id="soundToggle" type="button" aria-pressed="false">♫ Bật nhạc</button>
  <span id="soundStatus" role="status" aria-live="polite" hidden></span>
</div>

<!-- 1. Trang đầu -->
<section class="stage hero" id="s-hero">
  <div class="brand">Hỏi Bài</div>
  <h1>Điều gì đang làm bạn băn khoăn?</h1>
  <p class="sub">Viết câu hỏi của bạn, chọn ba lá bài, trả lời vài câu hỏi ngắn. Lá bài sẽ giúp bạn nhìn rõ hơn điều mình đang tìm.</p>
  <form class="ask" id="askForm">
    <textarea id="q" maxlength="200" placeholder="Ví dụ: Tôi có nên đổi việc trong năm nay không?" aria-label="Câu hỏi của bạn"></textarea>
    <button class="btn" type="submit">Trải bài</button>
  </form>
  <div class="err" id="err" role="alert"></div>
  <div class="eg" id="eg"></div>
  <div class="deco" aria-hidden="true" id="deco"></div>
</section>

<!-- 2. Trải bài -->
<section class="stage" id="s-spread" hidden>
  <div class="head"><h2>Chọn ba lá bài thu hút bạn</h2></div>
  <div class="q-echo" id="echo"></div>
  <div class="hint" id="spreadContext"></div>
  <div class="hint">Hít một hơi sâu, tập trung vào câu hỏi rồi chạm vào ba lá bài.</div>
  <div class="fan" id="fan"></div>
  <div class="count" id="count">Đã chọn 0 / 3</div>
</section>

<!-- 3. Lật bài, hỏi đáp và kết quả -->
<section class="stage" id="s-read" hidden>
  <div class="head"><h2>Thông điệp từ ba lá bài</h2></div>
  <div class="q-echo" id="echo2"></div>
  <div class="hint" id="spreadContext2"></div>
  <div class="row3" id="row3"></div>
  <div class="panel" id="panel"></div>
</section>

<script src="config.js"></script>
<script>
// Dọn các hạt sáng sau hiệu ứng; tôn trọng chế độ giảm chuyển động.
function cardSpark(element) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const rect = element.getBoundingClientRect();
  for (let i = 0; i < 10; i++) {
    const particle = document.createElement('span');
    const angle = i * Math.PI / 5;
    particle.className = 'fx-spark';
    particle.setAttribute('aria-hidden', 'true');
    particle.style.cssText = `left:${rect.left + rect.width / 2}px;top:${rect.top + rect.height / 2}px;--dx:${Math.cos(angle) * (rect.width / 2 + 35)}px;--dy:${Math.sin(angle) * (rect.height / 2 + 30)}px`;
    document.body.appendChild(particle);
    setTimeout(() => particle.remove(), 900);
  }
}
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const finePointer = matchMedia('(pointer: fine)');
  const aura = document.getElementById('cursorAura');
  let frame = 0, x = 0, y = 0;
  document.addEventListener('pointermove', event => {
    if (reduced.matches || !finePointer.matches) return;
    x = event.clientX; y = event.clientY;
    if (!frame) frame = requestAnimationFrame(() => {
      aura.style.transform = `translate3d(${x}px,${y}px,0)`;
      aura.classList.add('active'); frame = 0;
    });
  }, {passive: true});
  document.documentElement.addEventListener('pointerleave', () => aura.classList.remove('active'));
  document.addEventListener('click', event => {
    if (reduced.matches || !event.target.closest('button, .fan .card')) return;
    const rect = event.target.getBoundingClientRect();
    const ripple = document.createElement('span');
    ripple.className = 'fx-ripple';
    ripple.setAttribute('aria-hidden', 'true');
    ripple.style.left = (event.detail ? event.clientX : rect.left + rect.width / 2) + 'px';
    ripple.style.top = (event.detail ? event.clientY : rect.top + rect.height / 2) + 'px';
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 750);
  });
})();

// Tạo sao một lần; CSS đảm nhiệm chuyển động, không chạy vòng lặp JavaScript.
(() => {
  const field = document.getElementById('starfield');
  const stars = document.createDocumentFragment();
  for (let i = 0; i < 100; i++) {
    const star = document.createElement('span');
    star.className = 'star' + (i % 9 === 0 ? ' bright' : '');
    star.style.cssText = `--x:${Math.random() * 100}%;--y:${Math.random() * 100}%;--size:${i % 9 === 0 ? 2.5 : 1 + Math.random()}px;--opacity:${.3 + Math.random() * .6};--duration:${3 + Math.random() * 5}s;--delay:${-Math.random() * 8}s`;
    stars.appendChild(star);
  }
  field.appendChild(stars);
  const updateMotion = () => document.getElementById('cosmos').classList.toggle('paused', document.hidden);
  document.addEventListener('visibilitychange', updateMotion);
  updateMotion();
})();

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- Nhạc nền và hiệu ứng âm thanh ---------- */
let audioContext = null, audioMaster = null, audioEnabled = false, audioChosen = false;
let noiseBuffer = null;
const soundToggle = $('#soundToggle');
const soundStatus = $('#soundStatus');
const backgroundAudio = new Audio();
backgroundAudio.src = new URL('./music/mixkit-valley-sunset-127.mp3', window.location.href).href;
backgroundAudio.loop = true;
backgroundAudio.preload = 'auto';
backgroundAudio.volume = 0.25;
backgroundAudio.muted = true;
backgroundAudio.onerror = () => {
  soundStatus.hidden = true;
  console.error('Không tải được file nhạc. Hãy kiểm tra thư mục music.');
};

function updateAudioControl() {
  soundToggle.textContent = audioEnabled ? '♫ Tắt nhạc' : '♫ Bật nhạc';
  soundToggle.setAttribute('aria-pressed', String(audioEnabled));
  soundToggle.setAttribute('aria-label', audioEnabled ? 'Tắt nhạc nền và hiệu ứng âm thanh' : 'Bật nhạc nền và hiệu ứng âm thanh');
}

function ensureAudio() {
  if (audioContext) return;
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  if (!AudioContext) throw new Error('Trình duyệt này không hỗ trợ phát âm thanh.');

  audioContext = new AudioContext();
  audioMaster = audioContext.createGain();
  audioMaster.gain.value = 0.0001;
  audioMaster.connect(audioContext.destination);
}

async function setAudioEnabled(enabled) {
  if (enabled) {
    try {
      backgroundAudio.muted = true;
      await backgroundAudio.play();
      backgroundAudio.muted = false;
      audioEnabled = true;
      updateAudioControl();
      soundStatus.textContent = '';
      soundStatus.hidden = true;
    } catch (error) {
      backgroundAudio.muted = true;
      audioEnabled = false;
      updateAudioControl();
      soundStatus.hidden = true;
      console.error('Không thể phát nhạc nền:', error);
    }
  } else {
    audioEnabled = false;
    backgroundAudio.pause();
    soundStatus.textContent = 'Nhạc nền và hiệu ứng đã tắt.';
    soundStatus.hidden = true;
    updateAudioControl();
  }
}

function getNoiseBuffer() {
  if (!noiseBuffer) {
    noiseBuffer = audioContext.createBuffer(1, audioContext.sampleRate, audioContext.sampleRate);
    const samples = noiseBuffer.getChannelData(0);
    for (let i = 0; i < samples.length; i++) samples[i] = Math.random() * 2 - 1;
  }
  return noiseBuffer;
}

function playNoise(type) {
  if (!audioEnabled) return;
  const now = audioContext.currentTime;
  const source = audioContext.createBufferSource();
  const filter = audioContext.createBiquadFilter();
  const gain = audioContext.createGain();
  source.buffer = getNoiseBuffer();
  filter.type = type === 'shuffle' ? 'bandpass' : 'lowpass';
  filter.frequency.setValueAtTime(type === 'shuffle' ? 1500 : 2100, now);
  if (type !== 'shuffle') filter.frequency.exponentialRampToValueAtTime(380, now + 0.28);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.linearRampToValueAtTime(type === 'shuffle' ? 0.12 : 0.08, now + 0.035);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + (type === 'shuffle' ? 0.55 : 0.3));
  source.connect(filter);
  filter.connect(gain);
  gain.connect(audioMaster);
  source.start(now);
  source.stop(now + (type === 'shuffle' ? 0.58 : 0.32));
}

function playTone(frequency, duration, volume, type = 'sine') {
  if (!audioEnabled) return;
  const now = audioContext.currentTime;
  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();
  oscillator.type = type;
  oscillator.frequency.setValueAtTime(frequency, now);
  oscillator.connect(gain);
  gain.connect(audioMaster);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.linearRampToValueAtTime(volume, now + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
  oscillator.start(now);
  oscillator.stop(now + duration + 0.02);
}

}

function normalizeText(text) {
  return text.toLocaleLowerCase('vi')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/đ/g, 'd');
}

function chooseSpread(text) {
  const normalized = normalizeText(text);
  let best = SPREADS[0], bestScore = 0;
  for (const spread of SPREADS.slice(1)) {
    const score = spread.keywords.reduce((total, [keyword, weight]) => {
      return total + (normalized.includes(normalizeText(keyword)) ? weight : 0);
    }, 0);
    if (score > bestScore) { best = spread; bestScore = score; }
  }
  return best;
}

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

async function ai(messages, max = 2000) {
  if (!CONFIG.API_KEY || CONFIG.API_KEY.startsWith('DAN_')) throw new Error('Chưa điền API key. Mở file index.html và điền vào CONFIG.API_KEY.');
  let r;
  try {
    r = await fetch(CONFIG.BASE_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + CONFIG.API_KEY},
      body: JSON.stringify({model: CONFIG.MODEL, messages, max_tokens: max})
    });
  } catch (e) { throw new Error('Không kết nối được tới API (mạng hoặc CORS). Mở F12 > Console để xem chi tiết.'); }
  if (!r.ok) {
    let t = ''; try { t = (await r.json()).error?.message || ''; } catch (e) {}
    throw new Error('API trả lỗi ' + r.status + (t ? ': ' + t : ''));
  }
  const d = await r.json();
  return d.choices?.[0]?.message?.content || '';
}

const N = 21; let cards = [], pos = [], lock = false;

  deck = shuffle(DECK).map(c => ({...c, rev: Math.random() < .3}));

    c.setAttribute('role', 'button'); c.setAttribute('aria-label', 'Lá bài ' + (i + 1));
    c.tabIndex = 0; c.style.transform = 'translate(0,0)';
    c.onclick = () => toggle(i);
    c.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(i); } };
    fan.appendChild(c); cards.push(c);
  }
  picks = []; lock = false; fan.classList.remove('done'); updateCount();
  requestAnimationFrame(() => setTimeout(() => place(true), 350)); // bày bài từ chồng bài ra
}
function place(stagger) {
  const fan = $('#fan'), w = fan.clientWidth, cw = cards[0].offsetWidth, gap = (w - cw) / (N - 1);
  cards.forEach((c, i) => {
    const m = i - (N - 1) / 2, x = m * gap, y = Math.pow(m / (N / 2), 2) * 26 + (picks.includes(i) ? -30 : 0), r = m * 2.6;
    c.style.transitionDelay = stagger ? i * 35 + 'ms' : '0ms';
    c.style.transform = `translate(${x}px,${y}px) rotate(${r}deg)`;
    c.style.zIndex = i;
  });
}
addEventListener('resize', () => { if (cards.length && !$('#s-spread').hidden) place(false); });
function updateCount() { $('#count').textContent = 'Đã chọn ' + picks.length + ' / 3'; }
async function toggle(i) {
  if (lock) return;
  const k = picks.indexOf(i);
  if (k >= 0) picks.splice(k, 1);
  else { if (picks.length >= 3) return; picks.push(i); cardSpark(cards[i]); playSfx('click'); }
  cards.forEach((c, j) => c.classList.toggle('sel', picks.includes(j)));
  place(false); updateCount();
  if (picks.length === 3) {
    lock = true; await sleep(700);
    $('#fan').classList.add('done'); await sleep(600);
    startReading();
  }
}

  if (!qs || !qs.length) qs = [
    {q: 'Điều gì trong câu hỏi này khiến bạn băn khoăn nhất lúc này?', options: ['Sợ quyết định sai', 'Thiếu thông tin', 'Áp lực từ người khác']},
    {q: 'Nếu mọi việc suôn sẻ, bạn mong kết quả cuối cùng trông như thế nào?', options: ['Ổn định hơn', 'Tự do hơn', 'Được công nhận hơn']}];
  askLoop(qs);
}
async function getQuestions() {
  const txt = await ai([
    {role: 'system', content: SYS},
    {role: 'user', content: `Câu hỏi chính của người xem: "${question}"\nBa lá bài hỗ trợ (không làm thay đổi trọng tâm câu hỏi): ${cardsText(chosen)}.\n\nHãy đặt 2–4 câu hỏi ngắn bằng tiếng Việt để làm rõ câu hỏi chính trên. Mọi câu hỏi phải xuất phát từ "${question}", tập trung vào mong muốn, lo lắng, hoàn cảnh hiện tại hoặc rào cản cụ thể của người hỏi. Chỉ dùng lá bài để tinh chỉnh ngữ cảnh; không đặt câu hỏi chỉ để giải nghĩa lá bài.\nMỗi câu có đúng 3 gợi ý ngắn, mỗi gợi ý tối đa 6 từ. Không hỏi thông tin nhạy cảm như số giấy tờ hay tài khoản.\nChỉ trả về JSON đúng dạng: {"questions":[{"q":"...","options":["...","...","..."]}]}`}
  ], 900);
  const m = txt.match(/\{[\s\S]*\}/);
  const arr = JSON.parse(m[0]).questions.filter(x => x && x.q).slice(0, 4);
  return arr.length >= 2 ? arr : null;
}

/* ---------- Hỏi đáp ---------- */
const panel = $('#panel');
function loading(t) { panel.innerHTML = `<div class="load"><div class="spin"></div><span>${esc(t)}</span></div>`; }
const qa = [];
function askLoop(qs, i = 0) {
  if (i >= qs.length) return finish();
  const q = qs[i], opts = Array.isArray(q.options) ? q.options.slice(0, 4) : [];
  panel.innerHTML = `
    <div class="prog">Câu ${i + 1} / ${qs.length}</div>
    <h3>${esc(q.q)}</h3>
    <div class="chips">${opts.map(o => `<button type="button">${esc(o)}</button>`).join('')}</div>
    <textarea id="ans" placeholder="Viết câu trả lời của bạn…" maxlength="300"></textarea>
    <button class="btn" id="next">${i === qs.length - 1 ? 'Xem lời giải' : 'Tiếp tục'}</button>
    <div class="err" id="aerr"></div>`;
  const ta = $('#ans'); ta.focus();
  panel.querySelector('.chips').onclick = e => { if (e.target.tagName === 'BUTTON') { ta.value = e.target.textContent; ta.focus(); } };
  $('#next').onclick = () => {
    const a = ta.value.trim();
    if (!a) { $('#aerr').textContent = 'Hãy chọn một gợi ý hoặc viết vài chữ nhé.'; return; }
    qa.push({q: q.q, a}); askLoop(qs, i + 1);
  };
}

/* ---------- Kết quả ---------- */
async function finish() {
  loading('Đang đọc bài cho bạn…');
  try {
    const txt = await ai([
      {role: 'system', content: SYS},
      {role: 'user', content: `Câu hỏi chính của người xem: "${question}"\nKiểu trải bài được chọn: ${activeSpread.name} — ${activeSpread.description}\nBa lá bài đã rút: ${cardsText(chosen)}.\nCâu trả lời của người xem:\n${qa.map((x, i) => `${i + 1}. ${x.q}\n   → ${x.a}`).join('\n')}\n\nHãy tổng hợp câu hỏi, câu trả lời của người xem và ba lá bài thành một câu chuyện mạch lạc, luôn đánh thẳng vào câu hỏi chính. Diễn đạt ấm áp, tinh tế, chân thành và giàu gợi hình. Không giải nghĩa lá bài rời rạc như từ điển. Lá ngược chỉ nói về bài học/tắc nghẽn/cảnh báo nhẹ nhàng. Nêu rõ rằng đây là năng lượng hiện tại và hành động của người hỏi có thể thay đổi xu hướng.\n\nTrả kết quả bằng Markdown đúng 4 phần dưới đây:\n### 1. Thông điệp tổng quan\nTóm tắt 2–3 câu ngắn, bám trực tiếp câu hỏi chính.\n\n### 2. Giải mã chi tiết\nPhân tích lần lượt ba lá theo đúng vị trí của kiểu trải bài "${activeSpread.name}": ${POS.join(', ')}. Mỗi lá nêu hình ảnh/ý nghĩa cốt lõi và liên hệ cụ thể với câu hỏi cùng câu trả lời của người xem.\n\n### 3. Bức tranh toàn cảnh (Sự kết nối)\nXâu chuỗi các lá để nêu nguyên nhân gốc rễ, điều đang diễn ra và xu hướng sắp tới nếu giữ nguyên năng lượng.\n\n### 4. Lời khuyên dành cho bạn\nĐưa ra 1–2 hành động cụ thể, thực tế hoặc một câu hỏi tự vấn để áp dụng ngay.\n\nKhông thêm tiêu đề ngoài 4 phần này. Khoảng 300–400 từ. Không khẳng định tương lai chắc chắn.`}
    ], 2500);
    panel.innerHTML = `<div class="res">${md(txt)}</div>
      <div class="foot">Tarot là công cụ để suy ngẫm, không thay thế lời khuyên chuyên môn về sức khỏe, pháp lý hay tài chính.</div>
      <div class="actions"><button class="btn" id="again">Hỏi một câu khác</button><button class="btn ghost" id="copy">Sao chép kết quả</button></div>`;
    $('#again').onclick = () => location.reload();
    $('#copy').onclick = async e => { try { await navigator.clipboard.writeText(txt); e.target.textContent = 'Đã sao chép'; } catch (x) {} };
    panel.scrollIntoView({behavior: 'smooth', block: 'start'});
  } catch (e) {
    panel.innerHTML = `<h3>Chưa đọc được bài</h3><p class="err" style="min-height:0">${esc(e.message)}</p><div class="actions"><button class="btn" id="retry">Thử lại</button></div>`;
    $('#retry').onclick = finish;
  }
}
function md(t) {
  let out = '', list = false;
  const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  for (const raw of t.split('\n')) {
    const l = raw.trim();
    if (/^[-•*] /.test(l)) { if (!list) { out += '<ul>'; list = true; } out += '<li>' + inl(l.replace(/^[-•*] /, '')) + '</li>'; continue; }
    if (list) { out += '</ul>'; list = false; }
    if (!l) continue;
    if (/^#{1,4} /.test(l)) out += '<h3>' + inl(l.replace(/^#{1,4} /, '')) + '</h3>';
    else out += '<p>' + inl(l) + '</p>';
  }
  return out + (list ? '</ul>' : '');
}
</script>
